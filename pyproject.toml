[project]
name = "govee-mcp"
version = "0.1.0"
description = "MCP server for controlling Govee lights with an AI assistant"
requires-python = ">=3.10"
dependencies = ["mcp>=2.0", "httpx>=0.27"]

[project.scripts]
govee-mcp = "govee_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"   
